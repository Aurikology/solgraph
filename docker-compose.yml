# PostgreSQL 16 with Apache AGE, for the graph backend.
#   docker compose up -d
#   then set SOLGRAPH_PG_DSN=postgresql://solgraph:solgraph@127.0.0.1:5455/solgraph
services:
  age:
    image: apache/age:release_PG16_1.6.0
    environment:
      POSTGRES_USER: solgraph
      POSTGRES_PASSWORD: solgraph  # local development only
      POSTGRES_DB: solgraph
    ports:
      - "127.0.0.1:5455:5432"
    volumes:
      - age-data:/var/lib/postgresql/data

  redis:  # optional RPC cache: SOLGRAPH_REDIS_URL=redis://127.0.0.1:6380/0
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:6380:6379"

volumes:
  age-data:
