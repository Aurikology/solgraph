# The whole stack: docker compose up -d --build, then open http://127.0.0.1:8000
# Only the databases (to run SolGraph from your own Python): docker compose up -d age redis
#   SOLGRAPH_PG_DSN=postgresql://solgraph:solgraph@127.0.0.1:5455/solgraph
#   SOLGRAPH_REDIS_URL=redis://127.0.0.1:6380/0
# Ports are published on 127.0.0.1 only. Use 127.0.0.1, not localhost (see README).
services:
  app:
    build: .
    env_file:
      - path: .env  # GOOGLE_API_KEY or ANTHROPIC_API_KEY for /ask; optional
        required: false
    environment:
      SOLGRAPH_PG_DSN: postgresql://solgraph:solgraph@age:5432/solgraph
      SOLGRAPH_REDIS_URL: redis://redis:6379/0
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      age:
        condition: service_healthy
      redis:
        condition: service_healthy

  # PostgreSQL 16 with Apache AGE, for the graph
  age:
    image: apache/age:release_PG16_1.6.0
    environment:
      POSTGRES_USER: solgraph
      POSTGRES_PASSWORD: solgraph  # local development only
      POSTGRES_DB: solgraph
    ports:
      - "127.0.0.1:5455:5432"
    volumes:
      - age-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solgraph"]
      interval: 3s
      retries: 20

  # RPC cache
  redis:
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20

volumes:
  age-data:
