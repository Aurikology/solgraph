<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SolGraph</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.30.2/cytoscape.min.js"></script>
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --ink: #1c1c1a; --muted: #6b6b66; --line: #e3e3de;
    --accent: #6a4cff; --user: #2f7d5b; --program: #b5452f; --pacct: #c58a12; --unknown: #8a8a84;
    --edge: #b9b9b3; --bad: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121211; --panel: #1b1b19; --ink: #ecece8; --muted: #9a9a93; --line: #2c2c29;
      --accent: #9a86ff; --user: #5cc495; --program: #ef7a62; --pacct: #e9b443; --unknown: #8f8f88;
      --edge: #4a4a46; --bad: #ff8a80; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; align-items: baseline; gap: 12px; padding: 14px 20px;
    border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { font-size: 17px; margin: 0; letter-spacing: -0.01em; }
  header .sub { color: var(--muted); }
  .pill { margin-left: auto; font-size: 12px; padding: 2px 10px; border-radius: 99px;
    border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
  main { display: grid; grid-template-columns: 340px 1fr; height: calc(100vh - 53px); }
  aside { border-right: 1px solid var(--line); background: var(--panel); padding: 16px 18px;
    overflow-y: auto; }
  form { display: grid; gap: 8px; }
  label { font-size: 12px; color: var(--muted); }
  input, select, button { font: inherit; color: inherit; }
  input, select { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--bg); font-family: ui-monospace, Consolas, monospace; font-size: 12.5px; }
  .row { display: flex; gap: 8px; }
  .row select { width: auto; flex: 1; font-family: inherit; }
  button { padding: 8px 14px; border: 0; border-radius: 8px; background: var(--accent); color: #fff;
    cursor: pointer; font-weight: 600; }
  button:disabled { opacity: .55; cursor: progress; }
  button.ghost { background: transparent; color: var(--accent); border: 1px solid var(--line); }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
    margin: 22px 0 8px; }
  .msg { margin-top: 10px; font-size: 13px; color: var(--muted); min-height: 1.4em; }
  .msg.bad { color: var(--bad); }
  .addr { font-family: ui-monospace, Consolas, monospace; font-size: 12px; word-break: break-all; }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  td { padding: 4px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  td.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; padding-left: 8px; }
  .legend { display: flex; flex-wrap: wrap; gap: 10px 14px; font-size: 12px; color: var(--muted); }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px;
    vertical-align: -1px; }
  .kind { font-size: 11px; padding: 1px 7px; border-radius: 99px; border: 1px solid var(--line); }
  #cy { width: 100%; height: 100%; }
  .canvas { position: relative; min-height: 360px; }
  .empty[hidden] { display: none; }
  .empty { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted);
    text-align: center; padding: 24px; pointer-events: none; }
  a { color: var(--accent); }
  @media (max-width: 760px) {
    main { grid-template-columns: 1fr; height: auto; }
    aside { border-right: 0; border-bottom: 1px solid var(--line); }
    .canvas { height: 70vh; }
    header { padding: 12px 16px; flex-wrap: wrap; }
    header .sub { display: none; }
  }
</style>
</head>
<body>
<header>
  <h1>SolGraph</h1><span class="sub">who a wallet trades with, read-only</span>
  <span class="pill" id="net">connecting…</span>
</header>
<main>
  <aside>
    <form id="f">
      <label for="addr">Wallet address</label>
      <input id="addr" required autocomplete="off" spellcheck="false"
             pattern="[1-9A-HJ-NP-Za-km-z]{32,44}" placeholder="e.g. 443ZmWZN…QdeMoa9">
      <div class="row">
        <select id="depth" aria-label="Hops to show">
          <option value="1">1 hop</option><option value="2" selected>2 hops</option>
          <option value="3">3 hops</option>
        </select>
        <button id="go">Load</button>
      </div>
    </form>
    <div class="msg" id="msg">Loads the wallet's recent transactions from Solana, then draws every
      transfer around it.</div>

    <h2>Legend</h2>
    <div class="legend">
      <span><i class="dot" style="background:var(--user)"></i>user wallet</span>
      <span><i class="dot" style="background:var(--pacct)"></i>program account</span>
      <span><i class="dot" style="background:var(--program)"></i>program</span>
      <span><i class="dot" style="background:var(--unknown)"></i>unknown</span>
    </div>

    <div id="sel" hidden>
      <h2>Selected</h2>
      <div class="addr" id="selAddr"></div>
      <p><span class="kind" id="selKind"></span> · <a id="selLink" target="_blank" rel="noopener">explorer</a></p>
      <button class="ghost" id="expand" type="button">Load this wallet's history</button>
    </div>

    <div id="bal" hidden>
      <h2>Holds</h2>
      <table id="balT"></table>
    </div>
    <div id="cps" hidden>
      <h2>Trades with</h2>
      <table id="cpsT"></table>
    </div>
  </aside>
  <section class="canvas">
    <div id="cy"></div>
    <div class="empty" id="empty">Enter a wallet to draw its transfer graph.</div>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const short = (a) => a === "SOL" ? "SOL" : a.slice(0, 4) + "…" + a.slice(-4);
const fmt = (x) => Number(x).toLocaleString(undefined, { maximumSignificantDigits: 6 });
let network = "devnet", cy = null, busy = false;

async function api(path, opts) {
  const r = await fetch(path, opts);
  const body = await r.json().catch(() => ({}));
  if (!r.ok) {
    const d = body.detail;
    throw new Error(typeof d === "string" ? d : Array.isArray(d) ? d.map((e) => e.msg).join("; ")
                                                : `HTTP ${r.status}`);
  }
  return body;
}

function say(text, bad) { const m = $("msg"); m.textContent = text; m.className = bad ? "msg bad" : "msg"; }

function explorer(a) {
  const c = network === "mainnet" ? "" : `?cluster=${network}`;
  return `https://explorer.solana.com/address/${a}${c}`;
}

function rows(table, list) {
  table.replaceChildren(...list.map(([l, r, mono]) => {
    const tr = document.createElement("tr");
    const a = document.createElement("td"); a.textContent = l; if (mono) a.className = "addr";
    const b = document.createElement("td"); b.textContent = r; b.className = "n";
    tr.append(a, b); return tr;
  }));
}

// One drawn edge per (from, to, asset): repeated transfers become "12× 0.0299 SOL" (the total).
function merged(edges) {
  const m = new Map();
  for (const e of edges) {
    const k = `${e.source}|${e.destination}|${e.mint}`;
    const t = m.get(k) || { source: e.source, destination: e.destination, mint: e.mint, amount: 0, n: 0 };
    t.amount += e.amount; t.n += 1; m.set(k, t);
  }
  return [...m.values()];
}

function draw(g) {
  const color = { user: css("--user"), program: css("--program"),
                  program_account: css("--pacct"), unknown: css("--unknown") };
  const els = [
    ...g.nodes.map((n) => ({ data: { id: n.id, label: short(n.id), kind: n.kind, hops: n.hops,
                                    center: n.id === g.center ? 1 : 0 } })),
    ...merged(g.edges).map((e, i) => ({ data: { id: "e" + i, source: e.source, target: e.destination,
        n: e.n, label: (e.n > 1 ? `${e.n}× ` : "") + `${fmt(e.amount)} ${short(e.mint)}` } })),
  ];
  $("empty").hidden = g.edges.length > 0;
  if (!g.edges.length) $("empty").textContent = "No transfers loaded for this wallet yet.";
  if (cy) cy.destroy();
  cy = cytoscape({
    container: $("cy"), elements: els, wheelSensitivity: 0.25,
    style: [
      { selector: "node", style: { "background-color": (n) => color[n.data("kind")] || color.unknown,
        label: "data(label)", color: css("--ink"), "font-size": 10, "text-valign": "bottom",
        "text-margin-y": 4, width: 18, height: 18,
        "font-family": "ui-monospace, Consolas, monospace" } },
      { selector: "node[center = 1]", style: { width: 30, height: 30, "border-width": 3,
        "border-color": css("--accent") } },
      { selector: "node:selected", style: { "border-width": 3, "border-color": css("--ink") } },
      { selector: "edge", style: { width: (e) => Math.min(1.2 + Math.log2(e.data("n")), 5), "line-color": css("--edge"),
        "target-arrow-color": css("--edge"), "target-arrow-shape": "triangle",
        "curve-style": "bezier", label: "data(label)", "font-size": 8, color: css("--muted"),
        "text-rotation": "autorotate", "text-background-color": css("--bg"),
        "text-background-opacity": 1, "text-background-padding": 1 } },
    ],
    // rings by hop distance: the wallet in the middle, direct counterparties around it, and so on
    layout: { name: "concentric", concentric: (n) => 10 - n.data("hops"), levelWidth: () => 1,
              minNodeSpacing: 46, spacingFactor: 1.15, padding: 30, animate: false },
  });
  cy.on("tap", "node", (ev) => select(ev.target.id(), ev.target.data("kind")));
  if (g.truncated) say(`Showing the first ${g.nodes.length} addresses; the graph is larger.`);
}

function select(a, kind) {
  $("sel").hidden = false;
  $("selAddr").textContent = a;
  $("selKind").textContent = kind.replace("_", " ");
  $("selLink").href = explorer(a);
  $("expand").hidden = kind === "program" || kind === "program_account";
  $("expand").onclick = () => { $("addr").value = a; load(a); };
}

async function load(a) {
  if (busy) return;
  busy = true; $("go").disabled = true; $("expand").disabled = true;
  say("Loading recent transactions from Solana…");
  try {
    const ing = await api(`/wallet/${a}/ingest?limit=15`, { method: "POST" });
    say("Drawing…");
    const g = await api(`/wallet/${a}/graph?depth=${$("depth").value}`);
    draw(g);
    const failed = ing.could_not_load ? `, ${ing.could_not_load} could not be read (rate limit)` : "";
    say(`${ing.loaded_transactions} transactions loaded${failed}. ${g.nodes.length} addresses, ` +
        `${g.edges.length} transfers. Click a node for details.`);
    history.replaceState(null, "", `?wallet=${a}`);
    const [bal, cps] = await Promise.all([api(`/wallet/${a}/balances`),
                                          api(`/wallet/${a}/counterparties`)]);
    $("bal").hidden = false;
    rows($("balT"), [["SOL", fmt(bal.sol)], ...bal.tokens.slice(0, 8).map((t) => [short(t.mint), fmt(t.amount), true])]);
    $("cps").hidden = !Array.isArray(cps) || !cps.length;
    if (Array.isArray(cps)) rows($("cpsT"), cps.slice(0, 10).map((c) =>
      [`${short(c.wallet)} · ${c.kind.replace("_", " ")}`, `${c.transfers}× ${short(c.mint)}`, true]));
  } catch (e) {
    say(e.message, true);
  } finally {
    busy = false; $("go").disabled = false; $("expand").disabled = false;
  }
}

$("f").addEventListener("submit", (ev) => { ev.preventDefault(); load($("addr").value.trim()); });

api("/health").then((h) => {
  network = h.network;
  $("net").textContent = `${h.network} · ${h.graph === "AgeGraph" ? "Apache AGE" : "in-memory graph"}`;
}).catch(() => { $("net").textContent = "API unreachable"; });

const w = new URLSearchParams(location.search).get("wallet");
if (w) { $("addr").value = w; load(w); }
</script>
</body>
</html>
