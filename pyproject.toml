[project]
name = "solgraph"
version = "0.1.0"
description = "Read-only Solana assistant: LangChain agent over an Apache AGE graph of wallets, tokens and transfers."
readme = "README.md"
# solana-agent-kit-py 1.4.0 declares requires-python ==3.13.0 and langchain<0.4,
# which is what pins this project to Python 3.13.0 and the LangChain 0.3 line.
requires-python = "==3.13.0"
dependencies = [
    "solana-agent-kit-py==1.4.0",
    "langchain-anthropic>=0.3,<0.4",
    "langgraph>=0.2,<0.4",
    "pydantic>=2.10,<3",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
solgraph = "solgraph.__main__:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["solgraph"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# anchorpy (pulled in by solana-agent-kit-py) registers a pytest plugin that needs pytest-asyncio.
addopts = "-p no:pytest_anchorpy"
