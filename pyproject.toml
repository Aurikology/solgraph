[project]
name = "solgraph"
version = "1.0.0"
description = "Read-only Solana assistant: LangChain agent over an Apache AGE graph of wallets, tokens and transfers."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.2,<2",
    "langchain-core>=1.7,<2",
    "langchain-anthropic>=1.7,<2",
    "langchain-google-genai>=4.4,<5",
    "pydantic>=2.10,<3",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "psycopg[binary]>=3.2",
    # what the Solana Agent Kit helper SolGraph uses actually imports (see README)
    "requests>=2.32",
    "solders>=0.21",
    "construct>=2.10",
]
# solana-agent-kit-py 1.4.0 is installed separately with --no-deps: its declared pins
# (langchain<0.4, numpy<2, Python ==3.13.0) would hold the whole project on LangChain 0.3,
# whose Gemini adapter cannot do tool calls on Gemini 3 (no thought signatures).

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
solgraph = "solgraph.__main__:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["solgraph"]

[tool.pytest.ini_options]
testpaths = ["tests"]
