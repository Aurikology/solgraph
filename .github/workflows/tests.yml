name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      age:
        image: apache/age:release_PG16_1.6.0
        env:
          POSTGRES_USER: solgraph
          POSTGRES_PASSWORD: solgraph
          POSTGRES_DB: solgraph
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U solgraph"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # the Apache AGE integration test runs against the service above; nothing touches the network
      SOLGRAPH_TEST_PG_DSN: postgresql://solgraph:solgraph@localhost:5432/solgraph
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.0"  # solana-agent-kit-py declares ==3.13.0
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install --no-deps solana-agent-kit-py==1.4.0
          pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q -rs
