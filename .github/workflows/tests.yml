name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      # Postgres 16 + Apache AGE + pgvector (db/Dockerfile) and Redis, from docker-compose.yml.
      # The AGE, pgvector and Redis tests run against them; nothing touches the network.
      SOLGRAPH_TEST_PG_DSN: postgresql://solgraph:solgraph@127.0.0.1:5455/solgraph
      SOLGRAPH_TEST_REDIS_URL: redis://127.0.0.1:6380/0
    steps:
      - uses: actions/checkout@v4
      - name: Start the databases
        run: docker compose up -d --build --wait --wait-timeout 180 age redis
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.0"  # solana-agent-kit-py declares ==3.13.0
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install --no-deps solana-agent-kit-py==1.4.0
          pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q -rs
      - if: failure()
        run: docker compose logs age

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build the image and start the stack
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: The app answers from inside the stack
        run: |
          curl -fsS http://127.0.0.1:8000/health | tee health.json
          grep -q '"graph":"AgeGraph"' health.json
          grep -q '"cache":"RedisCache"' health.json
          curl -fsS http://127.0.0.1:8000/ | grep -q cytoscape
      - name: pgvector is installed beside Apache AGE
        run: |
          docker compose exec -T age psql -U solgraph -d solgraph -c "CREATE EXTENSION IF NOT EXISTS vector SCHEMA public" -c "SELECT '[1,0]'::vector <=> '[0,1]'::vector"
      - if: failure()
        run: docker compose logs
